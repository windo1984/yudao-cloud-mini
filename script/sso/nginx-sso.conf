# ==========================================================================
# 统一登录单域名部署样例（Nginx）
#
# 拓扑（浏览器只看到一个域名）：
#   https://sso.example.com
#     ├── /             yudao 后台前端（静态）
#     ├── /pay/         DaxPay 前端（静态）← 用户从这里登录
#     ├── /admin-api/   ft-gateway :19200 → yudao（网关注入 yudao 令牌）
#     └── /daxpay/      ft-gateway :19200 → DaxPay :19301（登录、退出、业务接口）
#
# 端口基准（与 yudao-cloud-mini-fork 实际配置一致）：
#   ft-gateway                   : 19200
#   DaxPay                       : 19301
#   yudao-gateway                : 19400
#   yudao-module-system-server   : 19401
#   yudao-module-infra-server    : 19402
#   yudao-server（单体 local）    : 19403
#
# yudao 的服务地址按你的运行方式二选一：
#   微服务：yudao-gateway :19400（再由它按 grayLb://system-server 转发到 :19401）
#   单体：  yudao-server  :19403（聚合 system+infra，需带 --spring.profiles.active=local）
#   只跑 system-server 模块时是 :19401
#
# 为什么必须同域：
#   DaxPay 登录成功后下发 HttpOnly Cookie「Accesstoken」（Path=/），
#   同域下浏览器访问 /daxpay/** 与 /admin-api/** 都会自动带上它，
#   于是「一次登录、两个系统都通行」，且令牌不暴露给前端 JS。
# ==========================================================================

upstream ft_gateway {
    server 127.0.0.1:19200;
    keepalive 32;
}

server {
    listen 443 ssl;
    server_name sso.example.com;

    ssl_certificate     /etc/nginx/certs/sso.example.com.pem;
    ssl_certificate_key /etc/nginx/certs/sso.example.com.key;

    client_max_body_size 100m;

    # ---------- yudao 后台前端 ----------
    location / {
        root      /data/www/yudao-admin;
        try_files $uri $uri/ /index.html;
    }

    # ---------- DaxPay 前端（登录入口） ----------
    # 要求 DaxPay 前端构建 base 设为 /pay/（vite 的 base / publicPath）
    location /pay/ {
        alias     /data/www/daxpay-ui/;
        try_files $uri $uri/ /pay/index.html;
    }

    # ---------- 统一入口网关 ----------
    # yudao 后台接口：网关签发 yudao 令牌后转发
    location /admin-api/ {
        proxy_pass         http://ft_gateway;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 120s;
    }

    # DaxPay 接口：登录、退出、业务接口（网关 StripPrefix=1 后转发给 DaxPay）
    location /daxpay/ {
        proxy_pass         http://ft_gateway;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 120s;
        # DaxPay 的 SSE（/daxpay/notify/user/sse/connect）不能被缓冲
        proxy_buffering    off;
    }
}
